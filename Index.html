<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PSB An-Nuriyah Bontocini 2027/2028</title>
<style>
:root{--green:#126b45;--green2:#198653;--gold:#d8aa35;--cream:#fffdf5;--ink:#173b2c;--muted:#64756c;--line:#dce8df}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,Segoe UI,Arial,sans-serif;background:linear-gradient(135deg,#f4fbf5,#fff9e8);color:var(--ink)}
header{background:linear-gradient(120deg,#075536,#168451);color:white;padding:30px 18px 25px;text-align:center;position:relative;overflow:hidden}
header:before,header:after{content:"✦";position:absolute;color:#f3d477;opacity:.25;font-size:110px}header:before{left:4%;top:-28px}header:after{right:5%;bottom:-48px}
.moon{font-size:30px;color:#f5d879;margin-bottom:8px}.brand-logo{display:block;width:clamp(105px,18vw,155px);height:auto;max-height:155px;object-fit:contain;margin:0 auto 14px;position:relative;z-index:1;filter:drop-shadow(0 4px 8px #001f1280)}header h1{max-width:900px;margin:0 auto 10px;font-size:clamp(22px,4vw,34px);line-height:1.25;letter-spacing:.3px}header p{margin:0;color:#e4f4e9}
.container{max-width:1080px;margin:22px auto;padding:0 15px 45px}
.nav{display:grid;grid-template-columns:repeat(7,minmax(100px,1fr));gap:8px;margin-bottom:18px;overflow-x:auto;padding-bottom:5px}
.nav button{border:1px solid var(--line);background:white;color:var(--green);border-radius:12px;padding:11px 8px;font-weight:700;cursor:pointer;min-width:100px}
.nav button.active{background:var(--green);color:white;border-color:var(--green);box-shadow:0 5px 14px #126b4525}
.panel{background:#fff;border:1px solid var(--line);border-radius:18px;padding:clamp(18px,3vw,30px);box-shadow:0 10px 30px #123c2410}
h2{margin:0 0 8px;color:var(--green);font-size:24px}.intro{color:var(--muted);margin:0 0 22px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}
.field{display:flex;flex-direction:column;gap:6px}.field.full{grid-column:1/-1}
label{font-weight:650;font-size:14px}input,select,textarea{width:100%;padding:12px 13px;border:1px solid #cbdccf;border-radius:10px;background:#fff;font:inherit;color:#173b2c;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--green2);box-shadow:0 0 0 3px #19865318}
textarea{min-height:82px;resize:vertical}.required{color:#b42318}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:13px}
.choice{border:1.5px solid var(--line);border-radius:14px;padding:19px;background:#fff;cursor:pointer;text-align:left;color:var(--ink);transition:.15s}
.choice strong{display:block;font-size:18px;color:var(--green);margin-bottom:5px}.choice span{color:var(--muted);font-size:13px}
.choice.selected{border-color:var(--green2);background:#effaf2;box-shadow:0 0 0 3px #19865315}
.info-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:13px}
.info-card{border:1px solid var(--line);background:#fbfefb;border-radius:13px;padding:15px}
.info-card h3{margin:0 0 9px;color:var(--green);font-size:16px}.info-card p{margin:5px 0;color:#42574b;font-size:14px}
.list{padding-left:22px;line-height:1.8;margin:8px 0}.contact{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid #edf2ed;font-size:14px}
.contact:last-child{border:0}.contact a{white-space:nowrap;text-decoration:none;color:var(--green);font-weight:700}
.progress-wrap{margin:0 0 18px}.progress-meta{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-bottom:7px}.progress{height:8px;background:#e8f0e9;border-radius:20px;overflow:hidden}.bar{height:100%;background:linear-gradient(90deg,#168451,#dfb33e);width:0%;transition:.2s}
.actions{display:flex;justify-content:space-between;gap:10px;margin-top:24px;flex-wrap:wrap}
.btn{border:0;border-radius:11px;padding:12px 18px;font-weight:750;cursor:pointer;font-size:14px}
.primary{background:var(--green);color:white}.secondary{background:#edf5ef;color:var(--green)}.gold{background:var(--gold);color:#263b2e}.btn:disabled{opacity:.45;cursor:not-allowed}
.note{font-size:13px;color:var(--muted);line-height:1.6}.alert{padding:12px 14px;border-radius:10px;background:#fff8df;border:1px solid #f0dda0;color:#665016;margin:14px 0;font-size:14px}
.summary{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.summary div{background:#f7fbf7;border:1px solid var(--line);padding:11px;border-radius:9px}.summary small{display:block;color:var(--muted);margin-bottom:4px}.summary b{overflow-wrap:anywhere}
footer{text-align:center;color:var(--muted);font-size:12px;padding:22px}
@media(max-width:650px){.grid,.summary{grid-template-columns:1fr}.nav{grid-template-columns:repeat(7,112px)}header{padding:25px 15px}.contact{align-items:flex-start;flex-direction:column}.actions .btn{flex:1}}
</style>
</head>

function fieldHTML(f){let [label,key,type="text",opts]=f;let req=required.includes(key);let control=type==="textarea"?`<textarea id="${key}" oninput="update('${key}',this.value)">${esc(data[key]||"")}</textarea>`:type==="select"?`<select id="${key}" onchange="update('${key}',this.value)"><option value="">Pilih ${label}</option>${opts.map(o=>`<option ${data[key]===o?"selected":""}>${o}</option>`).join("")}</select>`:`<input id="${key}" type="${type}" value="${esc(data[key]||"")}" ${type==="number"?"min='0'":""} oninput="update('${key}',this.value)" ${key==="nik"?"maxlength='16'":""}>`;
return `<div class="field"><label>${label}${req?' <span class="required">*</span>':""}</label>${control}</div>`;}
function formFields(arr){return `<div class="grid">${arr.map(fieldHTML).join("")}</div>`;}
function selectCards(key,items){return `<div class="cards">${items.map(([v,desc])=>`<button type="button" class="choice ${data[key]===v?"selected":""}" onclick="choose('${key}','${v}')"><strong>${v}</strong><span>${desc||"Pilih opsi ini"}</span></button>`).join("")}</div>`;}
function home(){return `<h2>Selamat Datang Calon Santri</h2><p class="intro">Silakan membaca persyaratan dan jadwal pendaftaran sebelum mengisi formulir.</p>
<div class="info-grid">
<div class="info-card"><h3>📋 Kelengkapan Berkas</h3><ol class="list"><li>Fotokopi Ijazah atau SKHU (3 lembar)</li><li>Pas foto 3 × 4 (3 lembar) dan 2 × 3 (3 lembar)</li><li>Fotokopi Kartu Keluarga (3 lembar)</li><li>Fotokopi Akta Kelahiran (3 lembar)</li><li>Fotokopi Rapor SD kelas 1–6 (1 rangkap)</li><li>Fotokopi Rapor SMP kelas 7–9 (1 rangkap)</li><li>Fotokopi PKH/KPS/KIP bagi yang memiliki (3 lembar)</li></ol></div>
<div class="info-card"><h3>📅 Jadwal Pendaftaran</h3><p><b>Gelombang I</b><br>1 Februari – 30 April 2027</p><p><b>Gelombang II</b><br>1 Mei – 30 Juni 2027</p><div class="alert">Pastikan seluruh berkas persyaratan disiapkan sebelum melakukan pendaftaran.</div></div></div>
<div class="info-card" style="margin-top:14px"><h3>☎ Kontak Panitia</h3>${contacts.map(([n,p])=>`<div class="contact"><span><b>${n}</b><br>${p}</span><a target="_blank" rel="noopener" href="https://wa.me/62${p.replace(/^0/,"").replace(/\D/g,"")}">WhatsApp ↗</a></div>`).join("")}</div>
<div class="actions"><span></span><button class="btn primary" onclick="go(1)">Mulai Pendaftaran →</button></div>`;}
function summaryHTML(){let labels={jenjang:"Jenjang Pendidikan",tanggalPendaftaran:"Tanggal Pendaftaran",namaSekolah:"Nama Sekolah",nisn:"NISN/NSPS",namaLengkap:"Nama Lengkap",tempatTanggalLahir:"Tempat dan Tanggal Lahir",nik:"NIK",jenisKelamin:"Jenis Kelamin",agama:"Agama",kewarganegaraan:"Kewarganegaraan",namaBapak:"Nama Bapak",namaIbuWali:"Nama Ibu/Wali",telpOrtu:"Telp/HP",emailOrtu:"Email",program:"Program Pembelajaran",ukuranBaju:"Ukuran Baju"};
return `<div class="summary">${Object.entries(labels).map(([k,l])=>`<div><small>${l}</small><b>${esc(data[k]||"—")}</b></div>`).join("")}</div>`;}
function render(){
renderNav();let body="";
if(current===0)body=home();
if(current===1)body=`<h2>Jenjang Pendidikan</h2><p class="intro">Pilih jenjang pendidikan dan isi tanggal pendaftaran.</p>${selectCards("jenjang",[["MI","Madrasah Ibtidaiyah"],["MTs","Madrasah Tsanawiyah"],["MA","Madrasah Aliyah"]])}<div class="field" style="margin-top:18px;max-width:420px"><label>Tanggal Pendaftaran <span class="required">*</span></label><input type="date" id="tanggalPendaftaran" value="${esc(data.tanggalPendaftaran||"")}" onchange="update('tanggalPendaftaran',this.value)"></div>`;
if(current===2)body=`<h2>Asal Sekolah</h2><p class="intro">Lengkapi informasi sekolah asal calon santri.</p>${formFields(fields.school)}`;
if(current===3)body=`<h2>Identitas Peserta Didik</h2><p class="intro">Masukkan biodata calon santri sesuai dokumen resmi.</p>${formFields(fields.student)}`;
if(current===4)body=`<h2>Identitas Orang Tua/Wali</h2><p class="intro">Lengkapi data orang tua atau wali calon santri.</p>${formFields(fields.parent)}`;
if(current===5)body=`<h2>Program Pembelajaran</h2><p class="intro">Pilih satu program pembelajaran.</p>${selectCards("program",[["Reguler","Program pembelajaran reguler"],["Tahfidz Murni","Program khusus tahfidz Al-Qur’an"]])}`;
if(current===6)body=`<h2>Ukuran Baju</h2><p class="intro">Pilih ukuran baju calon santri.</p>${selectCards("ukuranBaju",[["S","Small"],["M","Medium"],["L","Large"],["XL","Extra Large"],["Lainnya","Masukkan ukuran secara manual"]])}${data.ukuranBaju==="Lainnya"?`<div class="field" style="margin-top:14px"><label>Ukuran lainnya</label><input value="${esc(data.ukuranLainnya||"")}" oninput="update('ukuranLainnya',this.value)" placeholder="Contoh: XXL / 2XL"></div>`:""}<div class="alert">Periksa kembali data sebelum mengirim pendaftaran. Kolom bertanda * wajib diisi.</div><h3 style="color:var(--green)">Ringkasan Pendaftaran</h3>${summaryHTML()}<div class="actions"><button class="btn gold" onclick="saveData()">Simpan Pendaftaran</button><button class="btn primary" onclick="confirmWA()">Konfirmasi ke WhatsApp Panitia</button></div>`;
if(current!==6&&current!==0)body+=`<div class="actions"><button class="btn secondary" onclick="go(${current-1})">← Kembali</button><button class="btn primary" onclick="next()">Selanjutnya →</button></div>`;
content.innerHTML=body;updateProgress();
}
function go(i){current=Math.max(0,Math.min(6,i));render();window.scrollTo({top:0,behavior:"smooth"});}
function update(k,v){data[k]=v;updateProgress();}
function choose(k,v){data[k]=v;render();}
function next(){if(current===1&&!data.jenjang){alert("Silakan pilih jenjang pendidikan.");return;}go(current+1);}
function updateProgress(){let filled=required.filter(k=>String(data[k]||"").trim()).length;let pct=Math.round(filled/required.length*100);document.getElementById("progressText").textContent=pct+"%";document.getElementById("progressBar").style.width=pct+"%";}
function validate(){let missing=required.filter(k=>!String(data[k]||"").trim());if(data.ukuranBaju==="Lainnya"&&!data.ukuranLainnya?.trim())missing.push("ukuranLainnya");if(missing.length){alert("Mohon lengkapi kolom wajib: "+missing.join(", "));return false;}if(data.nik&&data.nik.length!==16){alert("NIK harus terdiri dari 16 digit.");return false;}return true;}
function saveData(){
  if(!validate())return;
  if(!confirm("Simpan dan kirim data pendaftaran ke formulir resmi?"))return;
  const form=document.createElement("form");
  form.method="POST";
  form.action=GOOGLE_FORM_RESPONSE_URL;
  form.target="googleFormSubmitFrame";
  form.style.display="none";
  Object.entries(GOOGLE_FORM_ENTRIES).forEach(([key,entryName])=>{
    let value=data[key]??"";
    if(key==="ukuranBaju" && value==="Lainnya") value=data.ukuranLainnya||"Lainnya";
    const input=document.createElement("input");
    input.type="hidden"; input.name=entryName; input.value=String(value);
    form.appendChild(input);
  });
  let frame=document.getElementById("googleFormSubmitFrame");
  if(!frame){
    frame=document.createElement("iframe");
    frame.name="googleFormSubmitFrame"; frame.id="googleFormSubmitFrame";
    frame.style.display="none"; document.body.appendChild(frame);
  }
  document.body.appendChild(form);
  form.submit();
  form.remove();
  alert("Pendaftaran Berhasil dan Formulir Masuk ke Email");
}
function confirmWA(){if(!validate())return;let phone="085241851090";let msg=`Assalamu’alaikum, Panitia PSB Pondok Pesantren An-Nuriyah Bontocini.\n\nSaya telah mengisi formulir pendaftaran Tahun Pelajaran 2027/2028. Berikut ringkasan data saya:\nNama: ${data.namaLengkap}\nJenjang: ${data.jenjang}\nTanggal Pendaftaran: ${data.tanggalPendaftaran}\nAsal sekolah: ${data.namaSekolah}\nProgram: ${data.program}\nUkuran baju: ${data.ukuranBaju==="Lainnya"?data.ukuranLainnya:data.ukuranBaju}\n\nMohon informasi untuk proses selanjutnya. Terima kasih.`;
window.open("https://wa.me/62"+phone.replace(/^0/,"").replace(/\D/g,"")+"?text="+encodeURIComponent(msg),"_blank","noopener");}
render();
</script>
</body>
</html>
